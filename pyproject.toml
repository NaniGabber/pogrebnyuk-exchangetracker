[project]
name = "exchangetracker"
version = "0.0.1"
description = "Збір і аналіз курсу валют та металів"
requires-python = ">=3.12"
dependencies = [
    "requests==2.31.0",
    "yfinance==1.7.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]

[project.scripts]
exchangetracker = "exchangetracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
