name: CI

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # ДОДАНО: Піднімаємо PostgreSQL для тестів
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exchangetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: |
          ruff check .

      - name: MyPy
        run: |
          mypy src

      - name: Pytest
        env:
          PYTHONPATH: src
          # ДОДАНО: Передаємо URL бази даних для тестів
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/exchangetracker
        run: |
          pytest -v

      - name: Architecture contracts
        run: |
          lint-imports
